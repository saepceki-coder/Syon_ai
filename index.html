<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Syon AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b5cff'/%3E%3Cpath d='M65 35 Q65 25 50 25 Q35 25 35 37 Q35 48 50 50 Q65 52 65 63 Q65 75 50 75 Q35 75 35 65' fill='none' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-theme" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg-0:#ffffff;--bg-1:#f9f9f9;--bg-2:#ececf1;--bg-3:#e5e5e5;--border:#e5e5e5;--text-0:#0d0d0d;--text-1:#565869;--text-2:#8e8ea0;--accent:#0b5cff;--accent-soft:#e8f0ff;--success:#10a37f;--danger:#ef4444;--warn:#f59e0b;--radius:14px;--radius-sm:10px;--font-mono:'JetBrains Mono','SF Mono',Consolas,monospace}
[data-theme="dark"]{--bg-0:#0d0d0d;--bg-1:#171717;--bg-2:#212121;--bg-3:#2f2f2f;--border:#2f2f2f;--text-0:#ececec;--text-1:#b4b4b4;--text-2:#8e8e8e;--accent:#4d8eff;--accent-soft:#1a2740}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-0);color:var(--text-0);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body{display:flex;height:100vh;height:100dvh}

#loginScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-0);overflow-y:auto}
#loginScreen.hide{opacity:0;pointer-events:none;transition:opacity .35s}
#loginScreen.hidden{display:none}
.login-card{position:relative;width:100%;max-width:400px;background:var(--bg-1);border:1px solid var(--border);border-radius:24px;padding:36px 28px 26px;text-align:center;margin:auto;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.login-logo{width:56px;height:56px;margin:0 auto 16px;display:block}
.login-title{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.login-title span{color:var(--text-1);font-weight:400}
.login-sub{font-size:13px;color:var(--text-2);margin-bottom:24px}
.auth-tabs{display:flex;gap:4px;background:var(--bg-2);border-radius:10px;padding:4px;margin-bottom:18px}
.auth-tab{flex:1;padding:9px;background:none;border:none;color:var(--text-1);font-weight:600;font-size:13.5px;cursor:pointer;border-radius:7px;font-family:inherit;transition:background .15s,color .15s}
.auth-tab.active{background:var(--bg-0);color:var(--text-0);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.auth-panel{display:flex;flex-direction:column;gap:10px;text-align:left}
.auth-panel input{width:100%;padding:12px 14px;background:var(--bg-0);border:1px solid var(--border);border-radius:10px;color:var(--text-0);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.auth-panel input:focus{border-color:var(--accent)}
.auth-submit{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.auth-submit:hover{opacity:.92}
.auth-error{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px;text-align:center}
#googleBtnWrapper{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:12px;align-items:center}
#googleBtnWrapper > div{width:100% !important}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;background:var(--bg-0);color:var(--text-0);border:1px solid var(--border);border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;transition:background .15s}
.google-btn:hover{background:var(--bg-2)}
.guest-btn{width:100%;padding:11px;background:var(--bg-2);color:var(--text-0);border:1px solid transparent;border-radius:10px;font-weight:500;font-size:13.5px;cursor:pointer;font-family:inherit}
.guest-btn:hover{background:var(--bg-3)}
.divider{display:flex;align-items:center;gap:12px;margin:14px 0 0;color:var(--text-2);font-size:11.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-note{margin-top:16px;font-size:11px;color:var(--text-2);line-height:1.5}

#app{display:none;height:100vh;height:100dvh;width:100%}
#app.show{display:flex}
.sidebar{width:260px;background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s;z-index:20}
.sidebar-header{padding:14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);cursor:pointer}
.sidebar-header:hover{background:var(--bg-2)}
.profile-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px;flex-shrink:0;background-size:cover;background-position:center;background-color:var(--accent)}
.brand{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new-chat-btn{margin:12px;padding:10px 14px;background:var(--bg-0);border:1px solid var(--border);border-radius:10px;color:var(--text-0);font-weight:500;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;transition:background .15s}
.new-chat-btn:hover{background:var(--bg-2)}
.search-box{margin:0 12px 8px;display:flex;align-items:center;gap:8px;background:var(--bg-0);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.search-box input{flex:1;background:none;border:none;color:var(--text-0);font-size:13px;outline:none}
.search-box input::placeholder{color:var(--text-2)}
.chat-list{flex:1;overflow-y:auto;padding:0 8px 10px}
.chat-item{padding:9px 11px;border-radius:9px;color:var(--text-1);font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:background .12s;white-space:nowrap;overflow:hidden}
.chat-item:hover{background:var(--bg-2)}
.chat-item.active{background:var(--bg-2);color:var(--text-0);font-weight:500}
.chat-item .title{flex:1;overflow:hidden;text-overflow:ellipsis}
.chat-item .del{opacity:0;background:none;border:none;cursor:pointer;padding:3px;display:flex;color:var(--text-2);border-radius:5px}
.chat-item:hover .del{opacity:1}
.chat-item .del:hover{color:var(--danger);background:var(--bg-3)}
.sidebar-footer{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.sidebar-footer button{padding:9px 12px;background:none;border:none;color:var(--text-1);border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;font-family:inherit;text-align:left;transition:background .12s}
.sidebar-footer button:hover{background:var(--bg-2);color:var(--text-0)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{padding:10px 14px;display:flex;align-items:center;gap:10px;position:relative;z-index:5}
.menu-btn{display:none;background:none;border:none;color:var(--text-1);cursor:pointer;padding:8px;border-radius:8px;align-items:center;justify-content:center}
.menu-btn:hover{background:var(--bg-2)}
.model-pill{display:flex;align-items:center;gap:8px;padding:7px 12px;background:transparent;border:1px solid transparent;border-radius:99px;font-size:13.5px;cursor:pointer;color:var(--text-1);max-width:100%;transition:background .12s}
.model-pill:hover{background:var(--bg-2);color:var(--text-0)}
.model-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0}
.model-pill .dot.on{background:var(--success)}
.model-pill .dot.warn{background:var(--warn)}
.model-pill .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.topbar .spacer{flex:1}
.icon-top{background:none;border:none;color:var(--text-1);cursor:pointer;padding:8px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.icon-top:hover{background:var(--bg-2);color:var(--text-0)}
.icon-top.active{color:var(--accent)}

.chat-scroll{flex:1;overflow-y:auto;padding:8px 16px 140px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat-inner{max-width:740px;margin:0 auto}
.welcome{text-align:center;padding:60px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.welcome .big-logo{width:56px;height:56px}
.welcome h1{font-size:26px;font-weight:600;letter-spacing:-.5px}
.welcome h1 span{color:var(--text-1);font-weight:400}
.welcome p{color:var(--text-2);max-width:420px;line-height:1.6;font-size:14px}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:20px;width:100%;max-width:560px}
.suggestion{padding:13px 14px;background:var(--bg-1);border:1px solid var(--border);border-radius:12px;text-align:left;cursor:pointer;color:var(--text-1);font-size:13px;font-family:inherit;transition:background .12s,border-color .12s,transform .12s}
.suggestion:hover{border-color:var(--accent);background:var(--bg-0);transform:translateY(-1px)}
.suggestion b{color:var(--text-0);display:block;margin-bottom:3px;font-size:13.5px;font-weight:600}

.msg{display:flex;gap:14px;margin-bottom:26px;position:relative;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.msg.user .avatar{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.msg.bot .avatar{background:var(--accent)}
.msg.bot .avatar svg{width:16px;height:16px;color:#fff}
.msg .body{flex:1;min-width:0;padding-top:1px}
.msg .name{font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.msg .content{line-height:1.72;color:var(--text-0);font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
.msg .content p{margin-bottom:14px}
.msg .content p:last-child{margin-bottom:0}
.msg .content strong{font-weight:650}
.msg .content ul,.msg .content ol{padding-left:24px;margin-bottom:14px}
.msg .content li{margin-bottom:5px}
.msg .content h1,.msg .content h2,.msg .content h3{margin:20px 0 10px;font-weight:650;line-height:1.3;letter-spacing:-.01em}
.msg .content h1{font-size:21px}.msg .content h2{font-size:17.5px}.msg .content h3{font-size:15.5px}
.msg .content h1:first-child,.msg .content h2:first-child,.msg .content h3:first-child{margin-top:0}
.msg .content blockquote{border-left:3px solid var(--accent);padding:6px 14px;margin:12px 0;color:var(--text-1);background:var(--bg-1);border-radius:0 8px 8px 0}
.msg .content hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.msg .content table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.msg .content th,.msg .content td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.msg .content th{background:var(--bg-1);font-weight:650}
.msg .content a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.msg .content code{background:var(--bg-2);padding:2px 6px;border-radius:5px;font-size:13px;font-family:var(--font-mono);color:#c7254e;border:1px solid var(--border)}
[data-theme="dark"] .msg .content code{color:#e9b1c9}
.msg .content pre{background:var(--bg-1)!important;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;overflow-x:auto;font-size:13px;line-height:1.6}
.msg .content pre code{background:none;border:none;padding:0;color:var(--text-0);font-size:13px}

.code-head{display:flex;justify-content:space-between;align-items:center;background:var(--bg-2);border:1px solid var(--border);border-bottom:none;padding:7px 12px;border-radius:10px 10px 0 0;font-size:11.5px;color:var(--text-2);font-family:var(--font-mono);margin-top:14px}
.code-head + pre{margin-top:0!important;border-radius:0 0 10px 10px!important}
.code-actions{display:flex;gap:4px;align-items:center}
.code-btn{background:none;border:none;color:var(--text-2);cursor:pointer;font-size:11.5px;padding:4px 8px;border-radius:5px;font-family:inherit;font-weight:500;display:flex;align-items:center;gap:4px}
.code-btn:hover{background:var(--bg-3);color:var(--text-0)}
.code-btn.primary{background:var(--accent);color:#fff}
.code-btn.primary:hover{opacity:.9}

.msg-toolbar{display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .12s;flex-wrap:wrap}
.msg:hover .msg-toolbar{opacity:1}
.msg-toolbar button{background:none;border:none;color:var(--text-2);cursor:pointer;padding:5px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-family:inherit;font-weight:500}
.msg-toolbar button:hover{background:var(--bg-2);color:var(--text-0)}
.msg-toolbar button svg{width:13px;height:13px}
.msg-toolbar button.speaking{color:var(--accent)}

.thinking{border:1px solid var(--border);border-radius:10px;background:var(--bg-1);margin-bottom:12px;overflow:hidden}
.thinking summary{padding:10px 14px;cursor:pointer;font-size:12.5px;color:var(--text-1);display:flex;align-items:center;gap:8px;list-style:none;font-weight:500}
.thinking summary::-webkit-details-marker{display:none}
.thinking summary::before{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--text-2);transition:transform .2s}
.thinking[open] summary::before{transform:rotate(90deg)}
.thinking .think-body{padding:8px 14px 14px;color:var(--text-2);font-size:12.5px;line-height:1.7;border-top:1px solid var(--border);white-space:pre-wrap;font-style:italic}

.cursor-blink::after{content:'';display:inline-block;width:7px;height:14px;background:var(--text-0);margin-left:2px;animation:blink 1s infinite;vertical-align:middle;border-radius:1px}
@keyframes blink{50%{opacity:0}}
.media-thumb{max-width:240px;border-radius:10px;margin:8px 0;border:1px solid var(--border);display:block}
.edit-area{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text-0);font-family:inherit;font-size:14.5px;resize:vertical;min-height:70px;outline:none;line-height:1.6}
.edit-area:focus{border-color:var(--accent)}

.input-wrap{position:absolute;bottom:0;left:0;right:0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg-0) 65%,transparent);pointer-events:none;z-index:10}
.input-box{max-width:740px;margin:0 auto;background:var(--bg-1);border:1px solid var(--border);border-radius:22px;padding:8px 10px 8px 14px;pointer-events:auto;transition:border-color .15s,box-shadow .15s;display:flex;align-items:flex-end;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 2px 12px rgba(11,92,255,.1)}
.attach-preview{position:absolute;bottom:100%;left:0;right:0;margin-bottom:8px;display:none;gap:8px;flex-wrap:wrap}
.attach-preview.show{display:flex}
.attach-item{position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg-1)}
.attach-item img{width:100%;height:100%;object-fit:cover}
.attach-item .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:11px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.icon-btn{width:34px;height:34px;flex-shrink:0;background:transparent;border:none;color:var(--text-1);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--bg-2);color:var(--text-0)}
.icon-btn.recording{color:var(--danger);background:rgba(239,68,68,.1);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
textarea#input{flex:1;background:none;border:none;color:var(--text-0);font-size:15px;font-family:inherit;resize:none;outline:none;padding:8px 4px;max-height:200px;line-height:1.5;min-height:34px}
textarea#input::placeholder{color:var(--text-2)}
.send-btn{width:34px;height:34px;flex-shrink:0;background:var(--accent);border:none;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s}
.send-btn:hover:not(:disabled){opacity:.9}
.send-btn:active:not(:disabled){transform:scale(.94)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--text-2)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-backdrop.show{display:flex}
.modal{background:var(--bg-0);border:1px solid var(--border);border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.15)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:15.5px;font-weight:600}
.modal-head .close{background:none;border:none;color:var(--text-2);cursor:pointer;padding:6px;display:flex;border-radius:8px}
.modal-head .close:hover{background:var(--bg-2);color:var(--text-0)}
.modal-body{padding:18px 20px;overflow-y:auto}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--text-1);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;background:var(--bg-1);border:1px solid var(--border);border-radius:9px;color:var(--text-0);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .help{font-size:11.5px;color:var(--text-2);margin-top:6px;line-height:1.5}
.field .help a{color:var(--accent)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
.range-val{font-size:12px;color:var(--text-2);min-width:44px;text-align:right;font-family:var(--font-mono)}
.provider-list{display:flex;flex-direction:column;gap:10px}
.provider-card{border:1px solid var(--border);border-radius:11px;padding:13px;background:var(--bg-1);transition:border-color .15s}
.provider-card.active{border-color:var(--accent);background:var(--accent-soft)}
.provider-card.valid{border-left:3px solid var(--success)}
.provider-card.invalid{border-left:3px solid var(--danger)}
[data-theme="dark"] .provider-card.active{background:rgba(77,142,255,.08)}
.provider-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.provider-card .pname{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(16,163,127,.12);color:var(--success);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.badge.paid{background:rgba(245,158,11,.12);color:#b45309}
.badge.local{background:rgba(99,102,241,.15);color:#6366f1}
.status-tag{font-size:10.5px;padding:3px 8px;border-radius:99px;font-weight:600}
.status-tag.ok{background:rgba(16,163,127,.12);color:var(--success)}
.status-tag.bad{background:rgba(239,68,68,.12);color:var(--danger)}
.status-tag.pending{background:var(--bg-2);color:var(--text-2)}
.status-tag.loading{background:rgba(245,158,11,.12);color:#b45309}
.provider-card input{width:100%;padding:9px 11px;background:var(--bg-0);border:1px solid var(--border);border-radius:7px;color:var(--text-0);font-size:12.5px;font-family:var(--font-mono);outline:none}
.provider-card input:focus{border-color:var(--accent)}
.provider-card .key-row{display:flex;gap:6px}
.provider-card .key-row input{flex:1}
.provider-card .key-row button{padding:0 10px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);border-radius:7px;cursor:pointer;display:flex;align-items:center}
.provider-card .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.provider-card .actions button{flex:1;min-width:100px;padding:8px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit;transition:background .12s}
.provider-card .actions button:hover{background:var(--bg-3);color:var(--text-0)}
.provider-card .actions button.test{background:var(--accent);color:#fff;border-color:var(--accent)}
.provider-card .actions button:disabled{opacity:.6;cursor:wait}
.provider-card .plink{font-size:11.5px;color:var(--accent);margin-top:6px;display:inline-block;text-decoration:none}
.diag-box{font-size:11.5px;margin-top:10px;padding:10px;border-radius:7px;background:var(--bg-0);border:1px solid var(--border);display:none;font-family:var(--font-mono);line-height:1.7;max-height:240px;overflow-y:auto}
.diag-box.show{display:block}
.diag-step{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px}
.diag-step .icon{flex-shrink:0;width:14px}
.diag-step.ok{color:var(--success)}
.diag-step.bad{color:var(--danger)}
.diag-step.info{color:var(--text-2)}
.diag-step.warn{color:var(--warn)}
.btn-primary{width:100%;padding:11px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-weight:600;cursor:pointer;font-size:13.5px;font-family:inherit;transition:opacity .15s}
.btn-primary:hover{opacity:.92}
.prompt-item{padding:11px 13px;background:var(--bg-1);border:1px solid var(--border);border-radius:9px;cursor:pointer;margin-bottom:6px;font-size:13px;color:var(--text-1);transition:background .12s,border-color .12s}
.prompt-item:hover{background:var(--bg-0);color:var(--text-0);border-color:var(--accent)}
.prompt-item b{color:var(--text-0);display:block;margin-bottom:2px;font-size:13.5px;font-weight:600}
.prompt-item span{color:var(--text-2);font-size:12px}
.profile-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--bg-1);margin-bottom:8px;cursor:pointer;transition:background .12s}
.profile-row:hover{background:var(--bg-2)}
.profile-row.active{border-color:var(--accent)}
.profile-avatar.lg{width:40px;height:40px;font-size:15px;border-radius:50%}
.profile-info{flex:1;min-width:0}
.profile-info .pname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-info .pmeta{font-size:11.5px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-selector{display:flex;gap:6px;align-items:center}
.voice-selector select{flex:1}
.voice-selector button{width:38px;height:38px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;color:var(--text-1);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.voice-selector button:hover{background:var(--bg-3);color:var(--text-0)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-0);color:var(--bg-0);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:2000;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:4px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-thumb:hover{background:var(--text-2)}
.kbd{font-family:var(--font-mono);background:var(--bg-2);padding:2px 7px;border-radius:5px;font-size:11px;border:1px solid var(--border)}
.shortcut-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.shortcut-row:last-child{border-bottom:none}
@media (max-width:768px){
.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);box-shadow:8px 0 30px rgba(0,0,0,.15)}

.welcome h1{font-size:22px}

}

async function hashPassword(password,salt){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256',enc.encode(salt+':'+password));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function makeSalt(){
  const arr=new Uint8Array(16);crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function decorateContent(el){
  el.querySelectorAll('pre').forEach(pre=>{
    if(pre.previousElementSibling&&pre.previousElementSibling.classList.contains('code-head'))return;
    const codeEl=pre.querySelector('code');
    const lang=(codeEl?.className||'').replace('language-','').replace('hljs','').trim()||'code';
    const codeText=codeEl?.textContent||'';
    const lines=codeText.split('\n').length;
    const isHtml = lang==='html' || /<!DOCTYPE html|<html|<body|<div class=/i.test(codeText.slice(0,300));
    const head=document.createElement('div');head.className='code-head';
    const langLabel=document.createElement('span');langLabel.textContent=lang;
    head.appendChild(langLabel);
    const actions=document.createElement('div');actions.className='code-actions';
    if(isHtml){
      const pv=document.createElement('button');pv.className='code-btn primary';
      pv.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Preview';
      pv.addEventListener('click',()=>openArtifact(codeText));
      actions.appendChild(pv);
    }
    const cp=document.createElement('button');cp.className='code-btn';cp.textContent='Copy';
    cp.addEventListener('click',()=>{navigator.clipboard.writeText(codeText).then(()=>toast('Kode disalin'));});
    actions.appendChild(cp);
    head.appendChild(actions);
    pre.parentNode.insertBefore(head,pre);
    if(lines>18){
      const wrapper=document.createElement('div');
      wrapper.style.cssText='position:relative;margin-bottom:14px';
      pre.parentNode.insertBefore(wrapper,pre);
      wrapper.appendChild(pre);
      pre.style.maxHeight='380px';pre.style.overflow='hidden';pre.style.position='relative';
      const gradient=document.createElement('div');
      gradient.style.cssText='position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(to top,var(--bg-1),transparent);pointer-events:none;border-radius:0 0 10px 10px';
      wrapper.appendChild(gradient);
      const ex=document.createElement('button');
      ex.className='code-btn';
      ex.style.cssText='position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--border);padding:6px 14px;border-radius:99px;z-index:2;font-size:11.5px';
      ex.textContent='Tampilkan semua ('+lines+' baris)';
      ex.addEventListener('click',()=>{pre.style.maxHeight='none';pre.style.overflow='visible';gradient.remove();ex.remove();});
      wrapper.appendChild(ex);
    }
  });
}

function stripMarkdown(s){
  return s.replace(/<thinking>[\s\S]*?<\/thinking>/gi,'').replace(/```[\s\S]*?```/g,' ').replace(/`([^`]+)`/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/__([^_]+)__/g,'$1').replace(/_([^_]+)_/g,'$1').replace(/^\s*[-*+]\s+/gm,'').replace(/^\s*\d+\.\s+/gm,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^#+\s+/gm,'').replace(/\n{2,}/g,'\n').trim();
}

function normalize(s){return String(s).toLowerCase().replace(/[^\w\s+*\-/^%().=]/g,' ').replace(/\s+/g,' ').trim();}

function tryMath(input){
  let s=input.toLowerCase().replace(/^(berapa|hitung|hasil dari|hasil|tolong hitung|what is|calculate)\s*/i,'').replace(/[?]/g,'').replace(/[x×]/g,'*').replace(/[:÷]/g,'/').replace(/,/g,'.').trim();
  if(!/\d/.test(s))return null;
  if(!/[+\-*/^%]/.test(s))return null;
  if(!/^[\d\s+\-*/^%().]+$/.test(s))return null;
  let expr=s.replace(/\^/g,'**').replace(/sqrt\(([^)]+)\)/g,'Math.sqrt($1)');
  try{const r=Function('"use strict"; return ('+expr+')')();if(typeof r==='number'&&isFinite(r)){const f=Number.isInteger(r)?r.toString():parseFloat(r.toFixed(10)).toString();return{expr:s,result:f};}}catch(e){return null;}
  return null;
}

function findInKB(query){
  const nq=normalize(query);if(!nq)return null;
  for(const item of KB)for(const q of item.q)if(normalize(q)===nq)return item.a;
  let best=null,bestLen=0;
  for(const item of KB)for(const q of item.q){
    const nk=normalize(q);
    if(nk.length<3)continue;
    if(nq.includes(nk)||nk.includes(nq)){
      if(nk.length>bestLen){best=item.a;bestLen=nk.length;}
    }
  }
  return best;
}

function buildMessages(chat,forVision){

  const history=chat.messages.slice(-20);
  for(const m of history){

      const images=(m.attachments||[]).filter(a=>a.type==='image');

        const parts=[{type:'text',text:m.content||''}];

  }
  return msgs;

async function fetchWithRetry(url,options,retries=1){

    try{return await fetch(url,options);}
    catch(e){lastErr=e;if(e.name==='AbortError')throw e;if(i<retries)await new Promise(r=>setTimeout(r,600));}
  }
  throw lastErr;
}

  while(true){const{value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){const st=line.trim();if(!st.startsWith('data:'))continue;const data=st.slice(5).trim();if(!data)continue;try{const j=JSON.parse(data);const txt=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';if(txt)onDelta(txt);}catch(e){}}}
}
async function callAnthropic(apiKey,model,messages,onDelta,signal){
  const s=currentSettings();let system='';const msgs=[];
  for(const m of messages){
    if(m.role==='system'){system+=m.content+'\n';continue;}
    if(Array.isArray(m.content)){
      const content=m.content.map(p=>{if(p.type==='text')return{type:'text',text:p.text};if(p.type==='image_url'){const mm=p.image_url.url.match(/^data:(.+?);base64,(.+)$/);if(mm)return{type:'image',source:{type:'base64',media_type:mm[1],data:mm[2]}};}return null;}).filter(Boolean);
      msgs.push({role:m.role,content});
    } else msgs.push({role:m.role,content:m.content});
  }
  const res=await fetchWithRetry(PROVIDERS.anthropic.url,{method:'POST',signal,headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:s.maxTokens,temperature:s.temperature,system:system.trim()||undefined,messages:msgs,stream:true})},1);
  if(!res.ok){const t=await res.text().catch(()=>'');throw new Error('HTTP '+res.status+': '+(t.slice(0,200)||res.statusText));}
  const reader=res.body.getReader();const decoder=new TextDecoder();let buf='';
  while(true){const{value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){const st=line.trim();if(!st.startsWith('data:'))continue;const data=st.slice(5).trim();if(!data)continue;try{const j=JSON.parse(data);if(j.type==='content_block_delta'&&j.delta?.text)onDelta(j.delta.text);}catch(e){}}}
}
async function streamChat(onDelta,signal){
  const s=currentSettings();const p=s.provider;const cfg=PROVIDERS[p];
  if(cfg.type==='syonbot'){
    const chat=getActiveChat();
    const lastUser=[...chat.messages].reverse().find(m=>m.role==='user');
    const reply=syonBotReply(lastUser?.content||'');
    for(let i=0;i<reply.length;i++){if(signal&&signal.aborted)break;onDelta(reply[i]);if(i%3===0)await new Promise(r=>setTimeout(r,6));}
    return;
  }
  if(state.session?.isGuest)throw new Error('Mode Tamu hanya bisa pakai Syon Bot. Daftar akun untuk buka provider lain.');
  const key=s.keys[p];
  if(!key&&p!=='custom')throw new Error('API key belum diisi untuk '+cfg.name);
  if(p==='custom'&&!s.customUrl)throw new Error('URL endpoint custom belum diisi');
  const chat=getActiveChat();
  const messages=buildMessages(chat,cfg.vision);
  if(s.thinking){
    if(messages[0]?.role==='system')messages[0].content+='\n\nSEBELUM menjawab, tuliskan proses berpikirmu di dalam <thinking>...</thinking>, lalu jawaban final di luar tag.';
    else messages.unshift({role:'system',content:'SEBELUM menjawab, tuliskan proses berpikirmu di dalam <thinking>...</thinking>.'});
  }
  if(cfg.type==='gemini')return callGemini(key,s.model,messages,onDelta,signal);
  if(cfg.type==='anthropic')return callAnthropic(key,s.model,messages,onDelta,signal);
  const providerCfg=p==='custom'?{...cfg,url:s.customUrl}:cfg;
  return callOpenAICompatible(providerCfg,key||'none',s.model,messages,onDelta,signal);
}

function diagStep(c,status,text){
  const div=document.createElement('div');div.className='diag-step '+status;
  const icons={ok:'✓',bad:'✗',info:'→',warn:'!'};
  div.innerHTML='<span class="icon">'+(icons[status]||'·')+'</span><span>'+esc(text)+'</span>';
  c.appendChild(div);c.scrollTop=c.scrollHeight;
}
async function fetchGeminiModels(apiKey){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers:{'x-goog-api-key':apiKey}});
  if(!r.ok){const t=await r.text();throw new Error('ListModels gagal: HTTP '+r.status+' — '+t.slice(0,200));}
  const j=await r.json();
  return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
}
async function fetchGroqModels(apiKey){
  const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{'Authorization':'Bearer '+apiKey}});
  if(!r.ok){const t=await r.text();throw new Error('ListModels gagal: HTTP '+r.status+' — '+t.slice(0,200));}

}
async function diagnostic(providerId,key,container){
  const s=currentSettings();
  container.innerHTML='';container.classList.add('show');
  diagStep(container,'info','Diagnostik: '+PROVIDERS[providerId].name);
  diagStep(container,'info','Panjang key: '+key.length);
  diagStep(container,'info','Prefix: '+key.slice(0,8)+'...');
  if(providerId==='gemini'){
    if(key.startsWith('AIza'))diagStep(container,'ok','Format: AIza... (resmi)');
    else if(key.startsWith('AQ.'))diagStep(container,'warn','Format: AQ... (tidak biasa)');
    else diagStep(container,'warn','Format tidak dikenali');
    diagStep(container,'info','Ambil daftar model...');
    try{
      const models=await fetchGeminiModels(key);
      if(!models.length){diagStep(container,'bad','Tidak ada model');return{ok:false,models:[]};}
      diagStep(container,'ok',models.length+' model:');
      models.slice(0,15).forEach(m=>diagStep(container,'info','  • '+m));
      if(models.length>15)diagStep(container,'info','  +'+(models.length-15)+' lagi');
      s.fetchedModels[providerId]=models;
      return{ok:true,models};
    }catch(e){diagStep(container,'bad',e.message);return{ok:false,models:[]};}
  }
  if(providerId==='groq'){
    if(!key.startsWith('gsk_'))diagStep(container,'warn','Format Groq biasanya gsk_');
    else diagStep(container,'ok','Format: gsk_... (benar)');
    diagStep(container,'info','Ambil daftar model...');
    try{
      const models=await fetchGroqModels(key);
      if(!models.length){diagStep(container,'bad','Tidak ada model');return{ok:false,models:[]};}
      diagStep(container,'ok',models.length+' model:');
      models.slice(0,20).forEach(m=>diagStep(container,'info','  • '+m));
      s.fetchedModels[providerId]=models;
      return{ok:true,models};
    }catch(e){diagStep(container,'bad',e.message);return{ok:false,models:[]};}
  }
  diagStep(container,'info','Testing generate...');
  try{const msg=await testKey(providerId,key);diagStep(container,'ok',msg);return{ok:true,models:PROVIDERS[providerId].models};}
  catch(e){diagStep(container,'bad',e.message);return{ok:false,models:[]};}
}
async function testKey(providerId,apiKey){
  const s=currentSettings();const cfg=PROVIDERS[providerId];
  if(!apiKey)throw new Error('API key kosong');
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),25000);
  try{
    if(cfg.type==='gemini'){
      const fetched=s.fetchedModels.gemini||[];
      const candidates=[...fetched,'gemini-2.0-flash','gemini-1.5-flash','gemini-1.5-pro'];
      let lastErr='';
      for(const m of candidates){
        try{
          const r=await fetch(cfg.url+'/models/'+m+':generateContent',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({contents:[{role:'user',parts:[{text:'hi'}]}],generationConfig:{maxOutputTokens:5}})});
          if(r.ok)return '✓ Key valid. Model "'+m+'" merespon.';
          lastErr='"'+m+'": HTTP '+r.status;
        }catch(e){lastErr='"'+m+'": '+e.message;}
      }
      throw new Error('Semua model gagal. Terakhir: '+lastErr);
    }
    if(cfg.type==='anthropic'){
      const r=await fetch(cfg.url,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-3-5-haiku-20241022',max_tokens:5,messages:[{role:'user',content:'hi'}]})});
      if(!r.ok){const txt=await r.text();throw new Error('HTTP '+r.status+' — '+txt.slice(0,200));}
      return '✓ Key valid';
    }
    let url=cfg.url,model=cfg.models[0]||'gpt-3.5-turbo';
    if(providerId==='custom'){url=s.customUrl;model=(s.customModels||'').split(/[,\n]/)[0].trim()||'gpt-3.5-turbo';}
    const r=await fetch(url,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model,messages:[{role:'user',content:'hi'}],max_tokens:5})});
    if(!r.ok){const txt=await r.text();throw new Error('HTTP '+r.status+' — '+txt.slice(0,200));}
    return '✓ Key valid. Model "'+model+'" merespon.';
  }finally{clearTimeout(t);}
}

function handleMessageAction(act,idx,btnEl){
  const chat=getActiveChat();if(!chat)return;
  const m=chat.messages[idx];if(!m)return;
  if(act==='copy'){navigator.clipboard.writeText(m.content).then(()=>toast('Disalin'));}
  else if(act==='del'){chat.messages.splice(idx,1);saveAll();renderChat();}
  else if(act==='speak'){
    if(speechSynthesis.speaking){stopSpeaking();return;}
    speak(m.content,{onStart:()=>{if(btnEl)btnEl.classList.add('speaking');},onEnd:()=>{if(btnEl)btnEl.classList.remove('speaking');}});
  }
  else if(act==='edit'){
    const msgEl=$('.msg[data-idx="'+idx+'"] .content');if(!msgEl)return;
    const old=m.content;
    msgEl.innerHTML='<textarea class="edit-area">'+esc(old)+'</textarea>';
    const ta=msgEl.querySelector('.edit-area');ta.focus();
    const saveBtn=document.createElement('button');saveBtn.className='btn-primary';saveBtn.style.marginTop='8px';saveBtn.textContent='Simpan & Kirim Ulang';
    saveBtn.addEventListener('click',()=>{
      const nv=ta.value.trim();if(!nv)return;
      chat.messages[idx].content=nv;
      chat.messages=chat.messages.slice(0,idx+1);
      saveAll();renderChat();
      regenerateFrom(idx);
    });
    msgEl.appendChild(saveBtn);
  }
  else if(act==='regen'){
    if(m.role!=='assistant')return;
    let userIdx=idx-1;
    while(userIdx>=0&&chat.messages[userIdx].role!=='user')userIdx--;
    if(userIdx<0){toast('Tidak ada pesan user',true);return;}
    chat.messages=chat.messages.slice(0,idx);
    saveAll();renderChat();
    regenerateFrom(userIdx);
  }
}

async function regenerateFrom(userIdx){
  if(state.generating)return;
  const chat=getActiveChat();if(!chat)return;
  chat.messages.push({role:'assistant',content:''});
  const botIdx=chat.messages.length-1;
  state.generating=true;updateSendBtn();
  const controller=new AbortController();currentAbort=controller;let acc='';
  renderChat();
  updateStreamingBot('');
  try{
    await streamChat(delta=>{acc+=delta;chat.messages[botIdx].content=acc;updateStreamingBot(renderMarkdown(acc));},controller.signal);
    chat.messages[botIdx].content=acc;saveAll();renderChat();
    if(state.voice.enabled)speak(acc);
  }catch(err){
    if(err.name==='AbortError')chat.messages[botIdx].content=acc+'\n\n_[Dihentikan]_';
    else{chat.messages[botIdx].content=acc+'\n\n**Error:** '+esc(err.message||'Gagal');toast('Gagal: '+(err.message||'').slice(0,60),true);}
    saveAll();renderChat();
  }finally{state.generating=false;currentAbort=null;updateSendBtn();}
}

async function sendMessage(){

  if(!text&&!hasAttach)return;
  try{
    let chat=getActiveChat();if(!chat)chat=createChat();
    chat.messages.push({role:'user',content:text,attachments:state.attachments.slice()});
    if(chat.messages.filter(m=>m.role==='user').length===1){chat.title=(text||'Gambar').slice(0,40);renderChatList();}
    state.attachments=[];renderAttachments();input.value='';autoGrow(input);
    saveAll();renderChat();
    chat.messages.push({role:'assistant',content:''});const botIdx=chat.messages.length-1;
    state.generating=true;updateSendBtn();
    const controller=new AbortController();currentAbort=controller;let acc='';
    updateStreamingBot('');
    try{
      await streamChat(delta=>{acc+=delta;chat.messages[botIdx].content=acc;updateStreamingBot(renderMarkdown(acc));},controller.signal);
      chat.messages[botIdx].content=acc;saveAll();renderChat();
      if(state.voice.enabled)speak(acc);
    }catch(err){
      if(err.name==='AbortError')chat.messages[botIdx].content=acc+'\n\n_[Dihentikan]_';
      else{console.error(err);chat.messages[botIdx].content=acc+'\n\n**⚠️ Error:** '+esc(err.message||'Gagal')+'\n\n_Coba buka Setelan → Diagnostik provider._';toast('Gagal: '+(err.message||'').slice(0,60),true);}
      saveAll();renderChat();
    }finally{state.generating=false;currentAbort=null;updateSendBtn();}
  }catch(err){
    console.error('Fatal error sendMessage:',err);
    toast('Error fatal: '+err.message,true);
    state.generating=false;updateSendBtn();
  }
}

let recognition=null;
function toggleVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Browser tidak support voice input',true);return;}
  if(!recognition){recognition=new SR();recognition.lang='id-ID';recognition.continuous=false;recognition.interimResults=true;}
  const btn=$('#micBtn');
  if(btn.classList.contains('recording')){recognition.stop();return;}
  let baseVal=$('#input').value;
  recognition.onresult=(e)=>{
    let txt='';
    for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;
    $('#input').value=baseVal+(baseVal?' ':'')+txt;
    autoGrow($('#input'));
  };
  recognition.onend=()=>{btn.classList.remove('recording');};
  recognition.onerror=(e)=>{btn.classList.remove('recording');toast('Voice: '+e.error,true);};
  try{recognition.start();btn.classList.add('recording');toast('🎤 Merekam...');}
  catch(e){toast('Gagal mulai voice',true);}
}

function initAuthScreen(){
  const wrapper=$('#googleBtnWrapper');if(!wrapper)return;
  wrapper.innerHTML='';
  const errEl=$('#authError');
  const showErr=msg=>{if(errEl)errEl.textContent=msg||'';};
  $$('.auth-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      $$('.auth-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const target=tab.dataset.tab;
      const pL=$('#panelLogin'),pR=$('#panelRegister');
      if(pL)pL.style.display=target==='login'?'flex':'none';
      if(pR)pR.style.display=target==='register'?'flex':'none';
      showErr('');
    });
  });
  $('#loginSubmit')?.addEventListener('click',async()=>{
    const email=$('#loginEmail').value.trim().toLowerCase();
    const password=$('#loginPassword').value;
    showErr('');
    if(!email||!password){showErr('Isi email & password');return;}
    const user=state.profiles.find(p=>p.email&&p.email.toLowerCase()===email&&p.passwordHash);
    if(!user){showErr('Akun tidak ditemukan. Daftar dulu?');return;}
    const hash=await hashPassword(password,user.salt);
    if(hash!==user.passwordHash){showErr('Password salah');return;}
    completeLogin(user.id,false);
  });
  $('#regSubmit')?.addEventListener('click',async()=>{
    const name=$('#regName').value.trim();
    const email=$('#regEmail').value.trim().toLowerCase();
    const password=$('#regPassword').value;
    showErr('');
    if(!name||!email||!password){showErr('Semua kolom wajib diisi');return;}
    if(!email.includes('@')){showErr('Email tidak valid');return;}
    if(password.length<6){showErr('Password minimal 6 karakter');return;}
    if(state.profiles.find(p=>p.email&&p.email.toLowerCase()===email)){showErr('Email sudah terdaftar');return;}
    const salt=makeSalt();
    const hash=await hashPassword(password,salt);
    const id='local-'+uid();
    const color=COLORS[name.charCodeAt(0)%COLORS.length];
    state.profiles.push({id,type:'local',name,email,salt,passwordHash:hash,color,createdAt:Date.now()});
    completeLogin(id,false);
    toast('🎉 Selamat datang, '+name+'!');
  });
  const guestBtn=document.createElement('button');
  guestBtn.className='guest-btn';
  guestBtn.textContent='Masuk sebagai Tamu';
  guestBtn.addEventListener('click',()=>{
    const id='guest-'+uid();
    state.profiles.push({id,type:'guest',name:'Tamu',isGuest:true,color:COLORS[7],createdAt:Date.now()});
    completeLogin(id,true);
    toast('👤 Mode Tamu — hanya Syon Bot');
  });
  wrapper.appendChild(guestBtn);

  if(GOOGLE_CLIENT_ID&&location.protocol!=='file:'){
    const holder=document.createElement('div');
    holder.style.width='100%';
    holder.style.marginTop='8px';
    wrapper.appendChild(holder);
    const initG=()=>{
      if(window.google&&window.google.accounts){
        try{
          window.google.accounts.id.initialize({
            client_id:GOOGLE_CLIENT_ID,
            callback:handleGoogleCredential,
            auto_select:false
          });
          window.google.accounts.id.renderButton(holder,{
            theme:'outline',
            size:'large',
            text:'continue_with',
            shape:'rectangular',
            logo_alignment:'left',
            width:340
          });
        }catch(e){
          console.warn('GSI init failed:',e);
          holder.innerHTML='<button class="google-btn" id="gFallback">Lanjutkan dengan Google</button>';
          $('#gFallback')?.addEventListener('click',()=>toast('Google Sign-In gagal dimuat. Coba refresh.',true));
        }
      } else {
        setTimeout(initG,300);
      }
    };
    initG();
  }
}

function decodeJwt(token){
  try{const p=token.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return null;}
}
function handleGoogleCredential(resp){
  const j=decodeJwt(resp.credential);
  if(!j){toast('Gagal decode token',true);return;}
  const id='google-'+j.sub;
  let p=state.profiles.find(x=>x.id===id);
  if(!p){p={id,type:'google',name:j.name||j.email,email:j.email,picture:j.picture,color:COLORS[3],createdAt:Date.now()};state.profiles.push(p);}
  else{p.name=j.name||p.name;p.email=j.email;p.picture=j.picture;}
  if(!state.settingsByProfile[id])state.settingsByProfile[id]=defaultSettings();
  if(!state.chatsByProfile[id])state.chatsByProfile[id]=[];
  completeLogin(id,false);
  toast('👋 Masuk: '+p.name);
}

    $('#saveVoice')?.addEventListener('click',()=>{saveAll();toast('✓ Pengaturan suara disimpan');$('#voiceModal').classList.remove('show');});

    $('#settingsBtn')?.addEventListener('click',()=>{renderSettingsModal();$('#settingsModal').classList.add('show');});
    $('#closeSettings')?.addEventListener('click',()=>{captureCurrentInputs();saveAll();updateTopbar();$('#settingsModal').classList.remove('show');});
    $('#settingsModal')?.addEventListener('click',e=>{if(e.target.id==='settingsModal'){captureCurrentInputs();saveAll();updateTopbar();e.currentTarget.classList.remove('show');}});
    $('#activeProvider')?.addEventListener('change',e=>{
      captureCurrentInputs();
      const s=currentSettings();
      if(state.session?.isGuest&&e.target.value!=='syonbot'){
        toast('Mode Tamu hanya bisa Syon Bot',true);
        e.target.value='syonbot';s.provider='syonbot';return;
      }
      s.provider=e.target.value;
      const p=PROVIDERS[s.provider];
      if(p.models.length)s.model=p.models[0];
      if(s.fetchedModels[s.provider]?.length)s.model=s.fetchedModels[s.provider][0];
      saveAll();renderModelSelect('#modelSelect',s.provider,s.model);
      renderProviderList();updateTopbar();
    });
    $('#modelSelect')?.addEventListener('change',e=>{currentSettings().model=e.target.value;saveAll();updateTopbar();});
    $('#saveSettings')?.addEventListener('click',()=>{captureCurrentInputs();saveAll();updateTopbar();toast('✓ Pengaturan disimpan');$('#settingsModal').classList.remove('show');});

    $('#promptsBtn')?.addEventListener('click',()=>{renderPrompts();$('#promptsModal').classList.add('show');});
    $('#closePrompts')?.addEventListener('click',()=>$('#promptsModal').classList.remove('show'));
    $('#promptsModal')?.addEventListener('click',e=>{if(e.target.id==='promptsModal')e.currentTarget.classList.remove('show');});

    $('#shortcutsBtn')?.addEventListener('click',()=>{renderShortcuts();$('#shortcutsModal').classList.add('show');});
    $('#closeShortcuts')?.addEventListener('click',()=>$('#shortcutsModal').classList.remove('show'));
    $('#shortcutsModal')?.addEventListener('click',e=>{if(e.target.id==='shortcutsModal')e.currentTarget.classList.remove('show');});

    $('#closeArtifact')?.addEventListener('click',()=>{
      $('#artifactModal').classList.remove('show');
      const frame=$('#artifactFrame');if(frame)frame.srcdoc='';
    });
    $('#artifactModal')?.addEventListener('click',e=>{if(e.target.id==='artifactModal'){e.currentTarget.classList.remove('show');const frame=$('#artifactFrame');if(frame)frame.srcdoc='';}});

    $('#modelPill')?.addEventListener('click',openModelModal);
    $('#closeModel')?.addEventListener('click',()=>$('#modelModal').classList.remove('show'));
    $('#modelModal')?.addEventListener('click',e=>{if(e.target.id==='modelModal')e.currentTarget.classList.remove('show');});
    $('#quickProvider')?.addEventListener('change',e=>{
      const p=e.target.value;const s=currentSettings();
      const first=s.fetchedModels[p]?.[0]||PROVIDERS[p].models[0]||'gpt-3.5-turbo';
      renderModelSelect('#quickModel',p,first);
    });
    $('#applyModel')?.addEventListener('click',()=>{
      const s=currentSettings();
      const chosen=$('#quickProvider').value;
      if(state.session?.isGuest&&chosen!=='syonbot'){toast('Mode Tamu hanya bisa Syon Bot',true);return;}
      s.provider=chosen;s.model=$('#quickModel').value;
      saveAll();updateTopbar();
      toast('✓ '+s.model);$('#modelModal').classList.remove('show');
    });

    document.addEventListener('keydown',e=>{
      const cmd=e.ctrlKey||e.metaKey;
      if(cmd&&e.key==='k'){e.preventDefault();$('#searchChats').focus();}
      if(cmd&&e.key==='n'){e.preventDefault();createChat();}
      if(cmd&&e.key==='e'){e.preventDefault();exportChat();}
      if(cmd&&e.key===','){e.preventDefault();renderSettingsModal();$('#settingsModal').classList.add('show');}
      if(cmd&&e.key==='/'){e.preventDefault();renderShortcuts();$('#shortcutsModal').classList.add('show');}
      if(e.key==='Escape'){
        if(speechSynthesis.speaking){stopSpeaking();return;}
        $$('.modal-backdrop.show').forEach(m=>m.classList.remove('show'));
      }
    });

    console.log('✅ Syon AI v11.2 initialized');
  }catch(err){
    console.error('❌ Init error:',err);
    const t=$('#toast');
    if(t){t.textContent='Error saat memuat: '+err.message;t.classList.add('show','error');}
  }
}

window.addEventListener('DOMContentLoaded',init);
</script>
</body>
   </html>
